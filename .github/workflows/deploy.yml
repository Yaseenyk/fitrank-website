name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Every morning at 06:00 India time: blog posts go live on their publish day (src/lib/blog.ts).
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm run lint
      # Built for wherever Pages serves the site: https://yaseenyk.github.io/fitrank-website
      # until the custom domain is set, then https://fitrank.streamerosai.com with no prefix.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: touch ./out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Tell IndexNow (Bing, Yandex, Seznam…) the site changed
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "fitrank.streamerosai.com",
              "key": "dd6e5bfaee2b2bbb2106aa7438b78078",
              "keyLocation": "https://fitrank.streamerosai.com/dd6e5bfaee2b2bbb2106aa7438b78078.txt",
              "urlList": [
                "https://fitrank.streamerosai.com/",
                "https://fitrank.streamerosai.com/features/",
                "https://fitrank.streamerosai.com/use-cases/",
                "https://fitrank.streamerosai.com/pricing/",
                "https://fitrank.streamerosai.com/how-it-works/",
                "https://fitrank.streamerosai.com/security/",
                "https://fitrank.streamerosai.com/results/",
                "https://fitrank.streamerosai.com/early-access/",
                "https://fitrank.streamerosai.com/blog/"
              ]
            }' || true

  keepalive:
    # GitHub switches off scheduled workflows after 60 days without repository activity;
    # enabling the workflow again resets that clock, so the daily publish keeps running.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow enable deploy.yml --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}

